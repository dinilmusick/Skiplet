name: Generate deterministic npm lockfile
on:
  push:
    branches:
      - feature/reusable-3d-meditation-starter
permissions:
  contents: write
jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve npm dependencies
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit reproducible lockfile to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore: lock starter dependencies"
          git push origin "HEAD:feature/reusable-3d-meditation-starter"
